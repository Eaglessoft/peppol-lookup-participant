apiVersion: apps/v1
kind: Deployment
metadata:
  name: peppol-lookup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peppol-lookup
  template:
    metadata:
      labels:
        app: peppol-lookup
    spec:
      containers:
        - name: peppol-lookup
          image: eaglessoftbv/peppol-lookup-participant:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_CONTEXT_PATH
              value: "/"
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "INFO"
            - name: ALLOWED_ORIGINS
              value: "https://tools.example.com"
            - name: JSON_PRETTY_PRINT
              value: "false"
            - name: PEPPOL_CODELIST_AUTO_REFRESH
              value: "false"
            - name: PEPPOL_CODELIST_REQUIRED
              value: "true"
            - name: PEPPOL_CACHE_TTL_SECONDS
              value: "900"
            - name: PEPPOL_SOURCE_CACHE_MAX_ENTRIES
              value: "500"
            - name: PEPPOL_SML_PROD_DNS_ZONE
              value: "participant.sml.prod.tech.peppol.org"
            - name: PEPPOL_SML_TEST_DNS_ZONE
              value: "participant.sml.test.tech.peppol.org"
            - name: PEPPOL_RATE_LIMIT_REQUESTS
              value: "120"
            - name: PEPPOL_RATE_LIMIT_WINDOW_SECONDS
              value: "60"
            - name: PEPPOL_COMPANY_LOOKUP_CONCURRENCY
              value: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: peppol-lookup
spec:
  selector:
    app: peppol-lookup
  ports:
    - port: 80
      targetPort: http
