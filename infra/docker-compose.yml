services:
  peppol-lookup:
    build:
      context: ..
      dockerfile: Containerfile
    container_name: peppol-lookup
    ports:
      - "8080:8080"
    environment:
      APP_CONTEXT_PATH: "/"
      LOG_FORMAT: "json"
      LOG_LEVEL: "INFO"
      ALLOWED_ORIGINS: "*"
    restart: unless-stopped

