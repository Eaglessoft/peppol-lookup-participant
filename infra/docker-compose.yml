services:
  peppol-lookup:
    image: eaglessoftbv/peppol-lookup-participant:latest
    build:
      context: ..
      dockerfile: Containerfile
    container_name: peppol-lookup
    ports:
      - "8080:8080"
    environment:
      APP_CONTEXT_PATH: "/"
      LOG_FORMAT: "json"
      LOG_LEVEL: "INFO"
      ALLOWED_ORIGINS: "*"
      JSON_PRETTY_PRINT: "false"
      PEPPOL_ADMIN_TOKEN: ""
      PEPPOL_CODELIST_AUTO_REFRESH: "false"
      PEPPOL_CODELIST_REQUIRED: "true"
      PEPPOL_CACHE_TTL_SECONDS: "900"
      PEPPOL_RATE_LIMIT_REQUESTS: "120"
      PEPPOL_RATE_LIMIT_WINDOW_SECONDS: "60"
    restart: unless-stopped

